name: Docker GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ghcr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install FFmpeg and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Test application and deployment script
        run: |
          python -m pytest -q
          node tests/timeline.test.cjs
          bash -n scripts/start.sh
          bash tests/start.test.sh

  image:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # PRs and manual runs on other branches never publish images.
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare source metadata
        id: source
        shell: python
        run: |
          import os
          import subprocess

          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          repository = os.environ["GITHUB_REPOSITORY"]
          source = f"{os.environ['GITHUB_SERVER_URL']}/{repository}"
          source_url = f"{source}/tree/{commit}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"image=ghcr.io/{repository.lower()}", file=output)
              print(f"commit={commit}", file=output)
              print(f"source={source}", file=output)
              print(f"source_url={source_url}", file=output)
              print(f"description=Camera events and on-demand live view. Commit: {commit}. Source: {source_url}", file=output)
      - name: Resolve Neolink base image
        id: base
        run: |
          # Pin the same base for the smoke-test build and the publication build.
          base=$(sed -n 's/^ARG NEOLINK_IMAGE=//p' Dockerfile)
          docker pull --platform linux/amd64 "$base"
          image=$(docker image inspect --format '{{index .RepoDigests 0}}' "$base")
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Image tags and source labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.source.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ steps.source.outputs.commit }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Neolink Studio
            org.opencontainers.image.base.name=${{ steps.base.outputs.image }}
            org.opencontainers.image.description=${{ steps.source.outputs.description }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.source=${{ steps.source.outputs.source }}
            org.opencontainers.image.url=${{ steps.source.outputs.source_url }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          annotations: |
            org.opencontainers.image.description=${{ steps.source.outputs.description }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.source=${{ steps.source.outputs.source }}
            org.opencontainers.image.url=${{ steps.source.outputs.source_url }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: neolink-studio:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEOLINK_IMAGE=${{ steps.base.outputs.image }}
            APP_REVISION=${{ steps.source.outputs.commit }}
            APP_SOURCE=${{ steps.source.outputs.source }}
            APP_SOURCE_URL=${{ steps.source.outputs.source_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test image without cameras
        run: |
          docker run --rm --entrypoint /bin/sh neolink-studio:ci -ec '
            neolink --help > /tmp/neolink-help
            grep -w replay /tmp/neolink-help
            grep -w rtsp /tmp/neolink-help
            ffmpeg -version > /dev/null
            ffprobe -version > /dev/null
          '
          docker run -d --name studio-ci -e DEMO_MODE=true -p 127.0.0.1:8080:8080 neolink-studio:ci
          trap 'docker logs studio-ci; docker rm -f studio-ci' EXIT
          for attempt in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' studio-ci)
            if [ "$status" = healthy ]; then
              curl -fsS http://127.0.0.1:8080/healthz
              curl -fsS http://127.0.0.1:8080/api/cameras > /tmp/cameras.json
              python -c 'import json; d=json.load(open("/tmp/cameras.json")); assert d["demo"] and len(d["cameras"]) == 3'
              exit 0
            fi
            [ "$status" != unhealthy ] || break
            sleep 2
          done
          exit 1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: env.PUBLISH == 'true'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            NEOLINK_IMAGE=${{ steps.base.outputs.image }}
            APP_REVISION=${{ steps.source.outputs.commit }}
            APP_SOURCE=${{ steps.source.outputs.source }}
            APP_SOURCE_URL=${{ steps.source.outputs.source_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarize publication
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_URL: ${{ steps.source.outputs.source_url }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            printf 'Image: `%s@%s`\n\n' "$IMAGE" "$DIGEST"
            printf 'Commit: `%s`\n\n' "$COMMIT"
            printf '[Matching source code](%s)\n' "$SOURCE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
